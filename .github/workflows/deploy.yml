name: Deploy CityScene Global

on:
  push:
    branches:
      - main

concurrency:
  group: citysceneglobal-production
  cancel-in-progress: true

jobs:
  build-frontend:
    name: Build Frontend
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: cityscene-frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: cityscene-frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build frontend (with production API URL)
        run: npm run build
        env:
          # Points the Flash API client to the live domain's /api endpoint (proxied by Nginx)
          VITE_FLASH_API_URL: https://citysceneglobal.com/api

      - name: Upload frontend build
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: cityscene-frontend/dist


  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    needs: build-frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download frontend build
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend

      - name: Copy frontend build to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          source: "frontend/*"
          target: "/opt/apps/citysceneglobal-website/frontend"
          strip_components: 1
          overwrite: true

      - name: Copy Nginx config to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          source: "cityscene-frontend/nginx.conf"
          target: "/tmp/citysceneglobal-nginx.conf"
          strip_components: 2
          overwrite: true

      - name: Deploy backend & reload Nginx
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          script_stop: true

          script: |
            set -e

            # --- Deploy Backend ---
            cd /opt/apps/citysceneglobal-website/app

            git fetch origin main
            git reset --hard origin/main

            docker compose build --pull backend
            docker compose up -d --remove-orphans backend

            docker image prune -f

            docker compose ps

            # --- Deploy Nginx Config ---
            sudo cp /tmp/citysceneglobal-nginx.conf /etc/nginx/sites-available/citysceneglobal.com
            sudo ln -sf /etc/nginx/sites-available/citysceneglobal.com /etc/nginx/sites-enabled/citysceneglobal.com
            sudo nginx -t
            sudo systemctl reload nginx

            echo "✅ Deployment complete — backend + frontend + nginx reloaded"
