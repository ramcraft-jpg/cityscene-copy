server {
    listen 80;
    server_name citysceneglobal.com www.citysceneglobal.com;

    # Redirect HTTP to HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name citysceneglobal.com www.citysceneglobal.com;

    # --- SSL Certificates (Let's Encrypt / Certbot) ---
    ssl_certificate     /etc/letsencrypt/live/citysceneglobal.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/citysceneglobal.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # --- Gzip Compression ---
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
    gzip_min_length 256;

    # --- Frontend Static Files (React SPA) ---
    root /opt/apps/citysceneglobal-website/frontend;
    index index.html;

    # Serve robots.txt and sitemap.xml directly (must come before SPA fallback)
    location = /robots.txt {
        add_header Content-Type text/plain;
        try_files $uri =404;
    }

    location = /sitemap.xml {
        add_header Content-Type application/xml;
        try_files $uri =404;
    }

    # Serve favicon.png directly
    location = /favicon.png {
        add_header Cache-Control "public, max-age=86400";
        try_files $uri =404;
    }

    # --- API Proxy → Backend Docker Container on port 5000 ---
    location /api/ {
        proxy_pass         http://localhost:5000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_read_timeout 60s;
    }

    # --- Backend Uploads (static media files) ---
    location /uploads/ {
        proxy_pass       http://localhost:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        add_header       Cache-Control "public, max-age=2592000";
    }

    # --- SPA Catch-all: serve index.html for all React routes ---
    # This ensures /about, /portfolio/slug, /blog/slug, etc. all work on direct load / refresh
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets aggressively (JS/CSS/fonts have hashed filenames from Vite)
    location ~* \.(js|css|woff2?|ttf|otf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location ~* \.(jpg|jpeg|png|gif|webp|svg|ico|mp4|webm)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        try_files $uri =404;
    }

    # Deny access to hidden files (.env, .git, etc.)
    location ~ /\. {
        deny all;
    }
}
